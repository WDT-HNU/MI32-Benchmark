name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-structure-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/core.txt -r requirements/dev.txt
      - name: Verify repository artifacts
        run: python scripts/verify_repository.py
      - name: Verify public metadata snapshot
        run: python scripts/verify_dataset.py datasets/mi32/metadata
      - name: Run lightweight structure and leakage gates
        run: |
          python -m pytest -q \
            tests/test_eegnet_structure.py \
            tests/test_tsception_structure.py \
            tests/test_rgnn_structure.py \
            tests/test_eegconformer_structure.py \
            tests/test_mi3rawtrials_semantics.py \
            tests/test_model_adapter_boundary.py \
            model_adapters/tests/test_adapters_contract.py
      - name: Compile Python sources
        run: python -m compileall -q .
